name: two-subnet-ixp
description: >-
  Two mirror enterprise subnets joined by a WAN-Interconnect fabric that is also
  the lab's REAL internet uplink. Each subnet: 3 PCs on a LAN (10.10.1.0/24 and
  10.20.1.0/24) behind an L2 switch, an internal firewalld firewall, and an edge
  router. The two routers peer over the WAN-Interconnect (100.64.0.0/24), which
  NATs to the public internet. pc1/pc2 run a real web host serving HTTP (TCP 80)
  AND HTTPS (TCP 443, self-signed TLS) plus a UDP echo service (UDP 9999); pc3
  runs real PostgreSQL (TCP 5432). Zero-trust routing (force_gateway): ALL PC
  traffic — even to a same-subnet neighbour — hairpins through the local
  firewall, so any pair can be blocked. Internet traffic routes PC -> switch ->
  firewall -> router -> WAN-Interconnect -> internet and is equally blockable.

# Every PC's traffic must traverse its firewall first (supervisor request):
# no connected-subnet routes on PCs — the firewall gateway is the only next hop.
force_gateway: true

nodes:
  # ── Subnet A ────────────────────────────────────────────────────────────
  - id: pc1a
    role: pc
    image: weblab-vuln:latest   # DELIBERATELY vulnerable (Alpine 3.14 / OpenSSL 1.1.1)
    idle: false          # nginx (HTTP 80 + HTTPS 443) runs as PID 1
    ports: [80, 443, 9999]
    launch: "socat UDP-LISTEN:9999,fork,reuseaddr EXEC:/bin/cat"   # persistent UDP echo
    interfaces:
      - {to: switcha, ip: 10.10.1.11/24, gateway: 10.10.1.1}

  - id: pc2a
    role: pc
    image: weblab:latest
    idle: false
    ports: [80, 443, 9999]
    launch: "socat UDP-LISTEN:9999,fork,reuseaddr EXEC:/bin/cat"
    interfaces:
      - {to: switcha, ip: 10.10.1.12/24, gateway: 10.10.1.1}

  - id: pc3a
    role: pc
    image: postgres:16-alpine
    idle: false
    env:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: [5432]
    interfaces:
      - {to: switcha, ip: 10.10.1.13/24, gateway: 10.10.1.1}

  - id: switcha
    role: switch
    image: alpine:3.20
    interfaces:
      - {to: pc1a}
      - {to: pc2a}
      - {to: pc3a}
      - {to: fwa}

  - id: fwa
    role: firewall
    image: firewalld-fw:latest
    interfaces:
      - {to: switcha, ip: 10.10.1.1/24}                       # LAN gateway
      - {to: routera, ip: 10.10.255.1/30, gateway: 10.10.255.2}  # uplink -> routerA

  - id: routera
    role: router
    image: alpine:3.20
    interfaces:
      - {to: fwa, ip: 10.10.255.2/30}
      - {to: ixp, ip: 100.64.0.1/24}
    routes:
      - {to: 10.10.1.0/24, via: 10.10.255.1}   # back to LAN-A via fwA
      - {to: 10.20.0.0/16, via: 100.64.0.2}    # everything in site B via routerB
      - {to: 0.0.0.0/0, via: 100.64.0.254}     # internet via the WAN gateway

  # ── WAN-Interconnect fabric (shared peering segment + REAL internet uplink)
  # Still bridges the two routers at L2, but also owns 100.64.0.254 on the
  # bridge, routes the two sites back via their routers, and NATs everything
  # else out its mgmt interface to the actual internet (wanlab = alpine +
  # iptables). PCs can apk/apt-install and browse real sites — through the
  # firewalls, so those flows are blockable like any lab traffic.
  - id: ixp
    role: switch
    image: wanlab:latest
    bridge_ip: 100.64.0.254/24
    nat: true
    routes:
      - {to: 10.10.0.0/16, via: 100.64.0.1}    # site A back via routerA
      - {to: 10.20.0.0/16, via: 100.64.0.2}    # site B back via routerB
    interfaces:
      - {to: routera}
      - {to: routerb}

  # ── Subnet B (mirror of A) ───────────────────────────────────────────────
  - id: routerb
    role: router
    image: alpine:3.20
    interfaces:
      - {to: fwb, ip: 10.20.255.2/30}
      - {to: ixp, ip: 100.64.0.2/24}
    routes:
      - {to: 10.20.1.0/24, via: 10.20.255.1}   # back to LAN-B via fwB
      - {to: 10.10.0.0/16, via: 100.64.0.1}    # everything in site A via routerA
      - {to: 0.0.0.0/0, via: 100.64.0.254}     # internet via the WAN gateway

  - id: fwb
    role: firewall
    image: firewalld-fw:latest
    interfaces:
      - {to: switchb, ip: 10.20.1.1/24}                       # LAN gateway
      - {to: routerb, ip: 10.20.255.1/30, gateway: 10.20.255.2}  # uplink -> routerB

  - id: switchb
    role: switch
    image: alpine:3.20
    interfaces:
      - {to: pc1b}
      - {to: pc2b}
      - {to: pc3b}
      - {to: fwb}

  - id: pc1b
    role: pc
    image: weblab:latest
    idle: false          # nginx (HTTP 80 + HTTPS 443) runs as PID 1
    ports: [80, 443, 9999]
    launch: "socat UDP-LISTEN:9999,fork,reuseaddr EXEC:/bin/cat"   # persistent UDP echo
    interfaces:
      - {to: switchb, ip: 10.20.1.11/24, gateway: 10.20.1.1}

  - id: pc2b
    role: pc
    image: weblab:latest
    idle: false
    ports: [80, 443, 9999]
    launch: "socat UDP-LISTEN:9999,fork,reuseaddr EXEC:/bin/cat"
    interfaces:
      - {to: switchb, ip: 10.20.1.12/24, gateway: 10.20.1.1}

  - id: pc3b
    role: pc
    image: postgres:16-alpine
    idle: false
    env:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: [5432]
    interfaces:
      - {to: switchb, ip: 10.20.1.13/24, gateway: 10.20.1.1}
