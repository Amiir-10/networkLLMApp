name: small-soc
description: Two PCs on separate subnets with a firewall routing between them. Day 2 baseline scenario.

nodes:
  - id: pc1
    role: pc
    image: alpine:3.20
    interfaces:
      - {to: fw, ip: 10.99.0.10/24, gateway: 10.99.0.1}

  - id: pc2
    role: pc
    image: alpine:3.20
    interfaces:
      - {to: fw, ip: 10.99.1.10/24, gateway: 10.99.1.1}

  - id: fw
    role: firewall
    image: alpine:3.20
    interfaces:
      - {to: pc1, ip: 10.99.0.1/24}
      - {to: pc2, ip: 10.99.1.1/24}
