# S1 baseline sequence (D A D U D) — llama3.1:70b (GPU phase, scale curve G17).
# Requires a 48 GB-class GPU host serving Ollama (model is ~43 GB Q4).
# Run via SSH tunnel (Path A) or on a vast.ai VM (Path B) — docs/RUNBOOK-VAST-*.md.
# Run ONE calibration rep first (--reps 1) before planning a full round.
id: s1-baseline-llama31-70b
scenario: two-subnet-ixp
model: llama3.1:70b
repetitions: 5
options:
  temperature: 0.0
sequence:
  - kind: D
    prompt: "Which firewall rules are currently active?"
  - kind: A
    prompt: "Block ping from pc1a to pc1b"
    expect: { unreachable: [[pc1a, pc1b]] }
    minimal_rules: 1
  - kind: D
    prompt: "Which firewall rules are currently active?"
  - kind: U
    prompt: "Unblock ping from pc1a to pc1b"
    expect: { unreachable: [] }
    minimal_rules: 0
  - kind: D
    prompt: "Which firewall rules are currently active?"
