# S1 baseline sequence (D A D U D) — qwen2.5-coder:7b twin of s1-baseline-llama31.
# New id per the spec-freeze rule: a model swap is a new experiment.
# CPU-feasible: ~35 min for 5 reps. Feeds G1/G9 (model comparison).
id: s1-baseline-qwen25
scenario: two-subnet-ixp
model: qwen2.5-coder:7b
repetitions: 5
options:
  temperature: 0.0
sequence:
  - kind: D
    prompt: "Which firewall rules are currently active?"
  - kind: A
    prompt: "Block ping from pc1a to pc1b"
    expect: { unreachable: [[pc1a, pc1b]] }
    minimal_rules: 1
  - kind: D
    prompt: "Which firewall rules are currently active?"
  - kind: U
    prompt: "Unblock ping from pc1a to pc1b"
    expect: { unreachable: [] }
    minimal_rules: 0
  - kind: D
    prompt: "Which firewall rules are currently active?"
