server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
    }
}

# The demo's "internet website" (Host-based virtual host): requests for
# example.com get an Example-Domain-style page instead of the node's default
# page. The scenario's Node.aliases entry points example.com at one web PC's
# data-plane IP, so this is what a lab PC sees when it browses example.com.
server {
    listen 80;
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        root  /usr/share/nginx/html-example;
        index index.html;
    }
}
